# Reusable delivery: main -> immutable images in GHCR -> QA deploy request.
#
# Called from a product repo's delivery.yml AFTER its CI passed on main.
# 1. main-guard: the commit must come from a PR merged by a release manager
# 2. build every image once, push ghcr.io/xbusiness-it/<name>:sha-<sha> (+ :main)
# 3. send repository_dispatch "deploy-qa" to ci-cd-repo with image digests
# Production never reacts to main: it is deployed only from an infra release prod-v*.
name: Delivery (reusable)

on:
  workflow_call:
    inputs:
      images:
        description: >
          JSON list of images: [{"var": "GATEWAY_IMAGE", "name": "gateway", "context": "gateway",
          "dockerfile": "gateway/Dockerfile", "target": "", "build_env": ""}].
          build_env qa|prod takes build args (KEY=VALUE lines) from secret BUILD_ENV_QA / BUILD_ENV_PROD.
        type: string
        required: true
      managers:
        type: string
        default: dym-dino

permissions:
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: delivery-${{ github.repository }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      pr: ${{ steps.guard.outputs.pr-number }}
      title: ${{ steps.guard.outputs.pr-title }}
    steps:
      - id: guard
        uses: XBusiness-IT/.github/actions/main-guard@main
        with:
          managers: ${{ inputs.managers }}

  build:
    needs: guard
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        env:
          NAME: ${{ matrix.image.name }}
          VARIANT: ${{ matrix.image.build_env }}
        run: |
          repo="ghcr.io/xbusiness-it/${NAME}"
          suffix="${VARIANT:+-$VARIANT}"
          {
            echo "repo=$repo"
            echo "tag=sha-${GITHUB_SHA}${suffix}"
            echo "tags<<__EOF__"
            echo "$repo:sha-${GITHUB_SHA}${suffix}"
            echo "$repo:main${suffix}"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          build-args: ${{ matrix.image.build_env && secrets[format('BUILD_ENV_{0}', matrix.image.build_env == 'qa' && 'QA' || 'PROD')] || '' }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.var }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.var }}
      - name: Record digest
        env:
          VAR: ${{ matrix.image.var }}
          REF: ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          echo "${VAR}=${REF}" > "digests/${VAR}.env"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ matrix.image.var }}
          path: digests/${{ matrix.image.var }}.env
          retention-days: 7

  request-qa-deploy:
    needs: [guard, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Dispatch deploy-qa to ci-cd-repo
        env:
          TOKEN: ${{ secrets.CICD_REPO_TOKEN }}
          PR: ${{ needs.guard.outputs.pr }}
          TITLE: ${{ needs.guard.outputs.title }}
        run: |
          set -euo pipefail
          test -n "$TOKEN" || { echo "::error::CICD_REPO_TOKEN is not configured"; exit 1; }
          cat digests/*.env | sort
          payload="$(python3 - <<'PY'
          import glob, json, os
          images = {}
          for path in sorted(glob.glob("digests/*.env")):
              key, _, value = open(path).read().strip().partition("=")
              images[key] = value
          print(json.dumps({"event_type": "deploy-qa", "client_payload": {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "sha": os.environ["GITHUB_SHA"],
              "pr": os.environ.get("PR", ""),
              "title": os.environ.get("TITLE", ""),
              "images": images,
          }}))
          PY
          )"
          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST "https://api.github.com/repos/XBusiness-IT/ci-cd-repo/dispatches" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "$payload"

  cleanup-registry:
    # Old image versions pile up in GHCR after every merge. Keep the newest 20 versions and anything
    # younger than 30 days; NEVER delete what QA, pending QA, prod or the last 5 prod releases use.
    needs: request-qa-deploy
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Collect digests in use
        env:
          TOKEN: ${{ secrets.CICD_REPO_TOKEN }}
        run: |
          set -euo pipefail
          get() { curl -fsS -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github.raw" "https://api.github.com/repos/XBusiness-IT/$1"; }
          raw() { get "$1" || true; }
          # Mandatory manifests: if they cannot be read, the step fails and nothing is deleted.
          get "ci-cd-repo/contents/qa.env?ref=qa-state" > qa.env
          get "infra/contents/releases/prod.env?ref=main" > prod.env
          {
            cat qa.env prod.env
            raw "ci-cd-repo/contents/qa-pending.env?ref=qa-state"
            for tag in $(curl -fsS -H "Authorization: Bearer $TOKEN" \
                "https://api.github.com/repos/XBusiness-IT/infra/tags?per_page=100" \
                | jq -r '[.[].name | select(startswith("prod-v"))] | sort | reverse | .[:5][]'); do
              raw "infra/contents/releases/prod.env?ref=$tag"
            done
          } | grep -oE 'sha256:[0-9a-f]{64}' | sort -u > protected.txt
          echo "protected digests: $(wc -l < protected.txt)"
          # Without the manifests we cannot tell what is in use - then delete nothing.
          [[ -s protected.txt ]] || { echo "::warning::no protected digests found, skipping cleanup"; exit 1; }
      - name: Delete old versions
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          for name in $(jq -r '.[].name' <<<"$IMAGES" | sort -u); do
            gh api --paginate "orgs/XBusiness-IT/packages/container/$name/versions?per_page=100" \
              --jq '.[] | [.id, .name, .created_at] | @tsv' | sort -t$'\t' -k3 -r > versions.tsv
            deleted=0
            n=0
            while IFS=$'\t' read -r id digest created; do
              n=$((n + 1))
              (( n <= 20 )) && continue
              [[ "$created" > "$cutoff" ]] && continue
              grep -qx "$digest" protected.txt && continue
              gh api -X DELETE "orgs/XBusiness-IT/packages/container/$name/versions/$id" >/dev/null
              deleted=$((deleted + 1))
            done < versions.tsv
            echo "$name: $(wc -l < versions.tsv) versions, deleted $deleted"
          done

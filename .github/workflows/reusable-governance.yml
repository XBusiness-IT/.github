# Reusable governance workflow for every XBusiness-IT repository.
# Callers: .github/workflows/governance.yml in each repo (see AGENTS.md).
#
#  - PR title must be "XIT-123: Описание на русском" and the YouGile task must exist
#  - every PR commit follows Conventional Commits: feat: / fix: / chore: ...
#  - PR ready for review / approved / changes requested -> Telegram alert with PR + task links
#  - PR opened / approved / changes requested / merged -> message in the YouGile task chat
#  - PR ready for review -> YouGile task moves to the «Ревью» column
#  - tags and releases may only be created by release managers; others are deleted + alert
#  - commits on main that did not come from a PR merged by a release manager -> alert
name: Governance (reusable)

on:
  workflow_call:
    inputs:
      managers:
        description: Space separated GitHub logins allowed to merge, tag and release
        type: string
        default: dym-dino

permissions:
  contents: write
  pull-requests: read

jobs:
  pr-title:
    name: Validate YouGile task reference
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      # No checkout of PR code: pull_request_target has secrets, the PR must not run its own code here.
      - uses: XBusiness-IT/.github/actions/yougile@main
        with:
          command: check
          api-key: ${{ secrets.YOUGILE_API_KEY }}

  commits:
    name: Conventional commit messages
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          types='feat|fix|chore|docs|refactor|test|ci|build|perf|style|revert'
          bad=0
          while IFS= read -r subject; do
            [[ -z "$subject" || "$subject" == Merge* ]] && continue
            if [[ ! "$subject" =~ ^($types)(\([a-z0-9._-]+\))?!?:\ .+ ]]; then
              echo "::error::Коммит не по формату 'feat: …' / 'fix: …' / 'chore: …': $subject"
              bad=1
            fi
          done < <(gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq '.[].commit.message | split("\n")[0]')
          exit $bad

  review-alert:
    name: Telegram review alert
    if: >-
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
       contains(fromJSON('["opened","reopened","ready_for_review"]'), github.event.action)) ||
      (github.event_name == 'pull_request_review' &&
       contains(fromJSON('["approved","changes_requested"]'), github.event.review.state))
    runs-on: ubuntu-latest
    steps:
      - id: msg
        env:
          EVENT: ${{ github.event_name }}
          STATE: ${{ github.event.review.state }}
          REVIEWER: ${{ github.event.review.user.login }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.event.repository.name }}
          NUM: ${{ github.event.pull_request.number }}
          TASK_URL_PREFIX: ${{ vars.YOUGILE_TASK_URL_PREFIX }}  # repo variable; kept out of this public repo
          TG_USERS: ${{ vars.TELEGRAM_USERNAMES }}
        run: |
          # GitHub login -> Telegram username (repo variable TELEGRAM_USERNAMES, JSON); fallback: login.
          tg() { python3 -c 'import json, sys; m = json.loads(sys.argv[2] or "{}"); sys.stdout.write(m.get(sys.argv[1], sys.argv[1]))' "$1" "$TG_USERS"; }
          # HTML for Telegram: user-provided text (PR title, logins) is escaped, links are hidden in text.
          esc() { python3 -c 'import html, sys; sys.stdout.write(html.escape(sys.argv[1], quote=False))' "$1"; }
          task=""
          if [[ "$TITLE" =~ ^(XIT-[0-9]+): ]]; then
            code="${BASH_REMATCH[1]}"
            if [[ -n "$TASK_URL_PREFIX" ]]; then
              task="Задача: <a href=\"${TASK_URL_PREFIX}${code}\">${code}</a>"
            else
              task="Задача: ${code}"
            fi
          fi
          if [[ "$EVENT" == pull_request_review && "$STATE" == approved ]]; then
            head="👍 <b>Одобрено — можно вливать</b> (@$(esc "$(tg "$REVIEWER")"))"
          elif [[ "$EVENT" == pull_request_review ]]; then
            head="✏️ <b>Нужны доработки</b> (@$(esc "$(tg "$REVIEWER")"))"
          else
            head="👀 <b>Нужно ревью</b> (@$(esc "$(tg "$AUTHOR")"))"
          fi
          pr="<a href=\"${URL}\">$(esc "$REPO") #${NUM}</a>: $(esc "${TITLE#*: }")"
          {
            echo "text<<__EOF__"
            printf '%s\n%s\n%s\n' "$head" "$pr" "$task"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
      - uses: XBusiness-IT/.github/actions/telegram-notify@main
        with:
          token: ${{ secrets.SERVICE_BOT_TOKEN }}
          chat-id: ${{ secrets.SERVICE_BOT_CHAT_ID }}
          topic-id: ${{ secrets.SERVICE_BOT_TOPIC_REVIEW || secrets.SERVICE_BOT_TOPIC_QA }}
          text: ${{ steps.msg.outputs.text }}
          parse-mode: HTML

  task-to-review:
    name: Task to «Ревью» in YouGile
    # PR is ready for review -> the task moves «Готово к работе» / «В работе» -> «Ревью».
    # Column ids are repo variables (YOUGILE_COLUMN_*), kept out of this public repo.
    if: >-
      github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
      contains(fromJSON('["opened","reopened","ready_for_review"]'), github.event.action)
    runs-on: ubuntu-24.04
    steps:
      - id: task
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$TITLE" =~ ^(XIT-[0-9]+): ]]; then echo "code=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"; fi
      - if: steps.task.outputs.code != ''
        uses: XBusiness-IT/.github/actions/yougile@main
        with:
          command: move
          api-key: ${{ secrets.YOUGILE_API_KEY }}
          task: ${{ steps.task.outputs.code }}
          to-column: ${{ vars.YOUGILE_COLUMN_REVIEW }}
          from-columns: ${{ vars.YOUGILE_COLUMN_READY }},${{ vars.YOUGILE_COLUMN_IN_PROGRESS }}

  yougile:
    name: Mirror PR event to YouGile
    if: >-
      (github.event_name == 'pull_request_target' &&
       contains(fromJSON('["opened","reopened","ready_for_review","closed"]'), github.event.action)) ||
      github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - uses: XBusiness-IT/.github/actions/yougile@main
        with:
          command: pr-event
          api-key: ${{ secrets.YOUGILE_API_KEY }}

  release-guard:
    name: Only release managers may tag / release
    if: (github.event_name == 'create' && github.event.ref_type == 'tag') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          MANAGERS: ${{ inputs.managers }} github-actions[bot]
          ACTOR: ${{ github.event_name == 'release' && github.event.release.author.login || github.actor }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.ref }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_USERS: ${{ vars.TELEGRAM_USERNAMES }}
        run: |
          # GitHub login -> Telegram username (repo variable TELEGRAM_USERNAMES, JSON); fallback: login.
          tg() { python3 -c 'import json, sys; m = json.loads(sys.argv[2] or "{}"); sys.stdout.write(m.get(sys.argv[1], sys.argv[1]))' "$1" "$TG_USERS"; }
          if [[ " $MANAGERS " == *" $ACTOR "* ]]; then
            echo "$TAG created by release manager $ACTOR"
            exit 0
          fi
          echo "::error::$ACTOR is not allowed to create tag/release $TAG - deleting"
          release_id="$(gh api "repos/$REPO/releases/tags/$TAG" --jq .id 2>/dev/null || true)"
          if [[ -n "$release_id" ]]; then gh api -X DELETE "repos/$REPO/releases/$release_id" || true; fi
          gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" || true
          esc() { python3 -c 'import html, sys; sys.stdout.write(html.escape(sys.argv[1], quote=False))' "$1"; }
          echo "text=⛔ <b>Тег/релиз без прав удалён</b>: @$(esc "$(tg "$ACTOR")") создал $(esc "$TAG") в $(esc "$REPO") · <a href=\"$RUN_URL\">лог</a>" >> "$GITHUB_OUTPUT"
          exit 1
      - if: failure()
        uses: XBusiness-IT/.github/actions/telegram-notify@main
        with:
          token: ${{ secrets.SERVICE_BOT_TOKEN }}
          chat-id: ${{ secrets.SERVICE_BOT_CHAT_ID }}
          topic-id: ${{ secrets.SERVICE_BOT_TOPIC_PROD }}
          parse-mode: HTML
          text: ${{ steps.check.outputs.text || format('⛔ Нарушение политики тегов в {0}', github.repository) }}

  main-guard:
    name: Main only via approved PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: XBusiness-IT/.github/actions/main-guard@main
        with:
          managers: ${{ inputs.managers }}
      - if: failure()
        uses: XBusiness-IT/.github/actions/telegram-notify@main
        with:
          token: ${{ secrets.SERVICE_BOT_TOKEN }}
          chat-id: ${{ secrets.SERVICE_BOT_CHAT_ID }}
          topic-id: ${{ secrets.SERVICE_BOT_TOPIC_QA }}
          parse-mode: HTML
          text: "⚠️ <b>В main попал коммит не через approved PR</b> — на QA не поедет\n<a href=\"${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}\">${{ github.event.repository.name }}</a> · push от @${{ fromJSON(vars.TELEGRAM_USERNAMES || '{}')[github.actor] || github.actor }}"

  delete-branch:
    name: Delete head branch of a closed PR
    # GitHub deletes merged branches itself (delete_branch_on_merge); this also covers PRs closed
    # without merge. Fork branches and protected names are never touched.
    if: >-
      github.event_name == 'pull_request_target' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(fromJSON('["main","master","qa-state"]'), github.event.pull_request.head.ref)
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          open="$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$BRANCH" --jq length)"
          if [[ "$open" != "0" ]]; then
            echo "Another open PR still uses $BRANCH - keeping it"
            exit 0
          fi
          if gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" 2>/dev/null; then
            echo "Deleted $BRANCH"
          else
            echo "$BRANCH already deleted"
          fi

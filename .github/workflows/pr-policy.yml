name: PR policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  metadata:
    name: Validate YouGile task reference
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^MIN-[0-9]+:\ .+ ]]; then
            echo "::error::PR title must match: MIN-123: Short description"
            exit 1
          fi
